plugins {
    id 'org.moddingx.modgradle.meta' version '5.0.3'
}

repositories {
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
}

var dev = System.getenv('IS_DEV')?.toBoolean() ?: false
var baseVersion = '21.6'

mod.configure {
    modid 'curseofcurses'
    group 'de.melanx'
    versioning {
        if (dev) {
            def gitCommitHash = ['git', 'rev-parse', 'HEAD'].execute().text.trim()
            constant baseVersion + (gitCommitHash ? "-${gitCommitHash}" : '')
        } else {
            base baseVersion
            maven 'https://maven.melanx.de/release'
        }
    }

    neoforge project.hasProperty('neo_version') ? project.neo_version : "${baseVersion}.8-beta"

    license 'MIT License'
    github 'ChaoticTrials/CurseOfCurses'

    changelog {
        def lines = defaultChangelog.toString().split('\n')
        def filteredChangelog = lines.findAll { !it.startsWith('- [[meta]') }.join('\n')

        return filteredChangelog
    }

    artifacts {
        sources {
            publishToRepositories()
        }
    }

    publishing {
        maven {
            name 'melanx'
            url 'https://maven.melanx.de/release'
            credentials(PasswordCredentials)
        }
    }

    upload {
        all {
            type 'beta'
            version '1.21.6'
            version '1.21.7'
        }
        curseforge {
            projectId 382881
        }
        modrinth {
            projectId 'HMcaBYVS'
        }
    }
}
